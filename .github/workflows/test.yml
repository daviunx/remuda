name: Test

# `pull_request`, NEVER `pull_request_target`. This is a public repo: the
# `test` job executes fork-authored test code and `pip install .` executes the
# PR's build backend. `pull_request_target` would run both with base-repo
# context, secrets in scope and a read/write token.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets publish.yml reuse this exact workflow as its release gate, so the PR
  # gate and the release gate can never drift apart.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Default `true` writes GITHUB_TOKEN into .git/config, where anything
          # running afterwards can read it, fork-authored test code included.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # PEP 735 path: ruff's version comes from [dependency-groups] dev, never
      # from an unpinned `pip install ruff`. `--group` needs pip >= 25.1.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev group
        run: pip install --group dev .

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev group
        run: pip install --group dev .

      - name: Run mypy
        run: mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors `requires-python = ">=3.12,<3.14"`.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + dev group
        run: pip install --group dev .

      # The coverage floor lives in [tool.coverage.report] fail_under, not in
      # a CI flag. One source of truth; pytest-cov fails the job below it.
      - name: Run pytest
        run: pytest --cov --cov-report=term-missing:skip-covered

  import-test:
    name: Import test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install .

      - name: Test import
        run: python -c "import remuda; print('Import OK')"

      - name: Test CLI help
        run: remuda --help
