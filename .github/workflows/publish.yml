name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # The release gate. A tag push does not trigger test.yml on its own, so
  # without this the tag pipeline would publish code no job had ever tested.
  test:
    name: Test gate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Build is deliberately SEPARATE from publish and holds no credential.
  # `python -m build` downloads the build backend (poetry-core, unpinned)
  # from PyPI and executes it; keeping it away from the publish credential
  # is PyPA's own recommended shape: build here, hand over a dist artifact,
  # publish there.
  build:
    name: Build distribution
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/remuda/
    # Token-based publish (secrets.PYPI_API_TOKEN, a project-scoped PyPI
    # token). Deviation from regrun's OIDC trusted publishing, deliberate:
    # trusted publishing needs a manual publisher registration on pypi.org;
    # flip to it later by removing `password:` and granting this job
    # `id-token: write` once the publisher is registered.
    #
    # No `actions/checkout` here. This job never touches repo source; it only
    # downloads the already-built dist and uploads it.
    permissions:
      contents: read
    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
